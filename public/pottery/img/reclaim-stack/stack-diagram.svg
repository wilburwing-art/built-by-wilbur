<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 615" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="15">
  <title>Vertical clay reclaim stack, cross section, top to bottom</title>
  <style>
    .wall{fill:none;stroke:#dce6f2;stroke-width:3}
    .pot{fill:none;stroke:#d9a441;stroke-width:3}
    .cloth{fill:none;stroke:#ffd166;stroke-width:2;stroke-dasharray:5 4}
    .lid{fill:#243244;stroke:#dce6f2;stroke-width:2}
    .water{fill:#1f3a5a}
    .cake{fill:#5a4634}
    .fines{fill:#3b2f26}
    .dim{stroke:#8fa3bb;stroke-width:1}
    .lbl{fill:#dce6f2}
    .dimlbl{fill:#8fa3bb;font-size:13.5px}
    .num{fill:#ffd166;font-weight:700}
  </style>

  <!-- 1. terracotta pot -->
  <path class="pot" d="M150 70 L170 170 L250 170 L270 70 Z"/>
  <path class="pot" d="M140 70 H280"/>
  <circle cx="210" cy="170" r="5" fill="#5a4634" stroke="#d9a441" stroke-width="2"/>
  <text class="num" x="300" y="78">1</text>
  <text class="lbl" x="312" y="78">Terracotta pot, unglazed, 14 in.</text>
  <text class="dimlbl" x="312" y="94">Drain hole plugged with clay</text>
  <text class="dimlbl" x="312" y="110">Flared wall rests on B's rim</text>

  <!-- 2. bucket B -->
  <path class="wall" d="M130 150 L142 320 H278 L290 150"/>
  <path class="cloth" d="M126 162 Q136 300 150 312 H270 Q284 300 294 162"/>
  <rect class="cake" x="150" y="250" width="120" height="60" rx="6"/>
  <path class="dim" d="M180 320 V335 M240 320 V335"/>
  <g stroke="#8fa3bb" stroke-width="1" stroke-dasharray="2 3">
    <path d="M180 324 H240"/>
  </g>
  <text class="num" x="300" y="200">2</text>
  <text class="lbl" x="312" y="200">Bucket B, filter bucket</text>
  <text class="dimlbl" x="312" y="216">20 to 30 holes, 1/4 in.,</text>
  <text class="dimlbl" x="312" y="232">inside a 5 to 6 in. center circle</text>
  <text class="dimlbl" x="312" y="248">Pillowcase folded over rim</text>
  <text class="dimlbl" x="312" y="264">(dashed), optional strainer bag</text>
  <text class="dimlbl" x="312" y="280">Clay cake collects in the liner</text>
  <!-- drips -->
  <g fill="#1f3a5a" stroke="#8fa3bb" stroke-width="1">
    <path d="M190 326 q-5 8 0 12 q5 -4 0 -12"/>
    <path d="M210 332 q-5 8 0 12 q5 -4 0 -12"/>
    <path d="M230 326 q-5 8 0 12 q5 -4 0 -12"/>
  </g>

  <!-- 3. lid A -->
  <rect class="lid" x="118" y="342" width="184" height="12" rx="3"/>
  <rect x="172" y="340" width="76" height="16" fill="#0a0e14"/>
  <path class="dim" d="M172 366 H248 M172 362 V370 M248 362 V370"/>
  <text class="dimlbl" x="210" y="384" text-anchor="middle">6 in. hole</text>
  <text class="num" x="320" y="352">3</text>
  <text class="lbl" x="332" y="352">Lid A, the platform</text>
  <text class="dimlbl" x="332" y="368">B stands on it, holes</text>
  <text class="dimlbl" x="332" y="384">centred over the opening</text>

  <!-- 4. bucket A -->
  <path class="wall" d="M130 354 L142 540 H278 L290 354"/>
  <rect class="water" x="146" y="430" width="128" height="106"/>
  <rect class="fines" x="146" y="516" width="128" height="20"/>
  <!-- spigot -->
  <rect x="278" y="500" width="30" height="12" fill="#d9a441" rx="2"/>
  <rect x="300" y="496" width="8" height="20" fill="#d9a441" rx="2"/>
  <path class="dim" d="M320 506 V540 M316 506 H324 M316 540 H324"/>
  <text class="dimlbl" x="328" y="528">2 in. up</text>
  <text class="num" x="320" y="440">4</text>
  <text class="lbl" x="332" y="440">Bucket A, clean water</text>
  <text class="dimlbl" x="332" y="456">Spigot 2 in. above the floor</text>
  <text class="dimlbl" x="332" y="472">Fines settle below the draw line</text>

  <!-- 5. base -->
  <rect x="120" y="552" width="180" height="40" fill="#141c28" stroke="#dce6f2" stroke-width="2" rx="3"/>
  <path d="M150 552 V592 M180 552 V592 M210 552 V592 M240 552 V592 M270 552 V592" stroke="#243244" stroke-width="2"/>
  <text class="num" x="320" y="570">5</text>
  <text class="lbl" x="332" y="570">Base, cinder block or crate</text>
  <text class="dimlbl" x="332" y="586">Jug fits under the spigot</text>

  <!-- overall height -->
  <path class="dim" d="M80 70 V592 M76 70 H84 M76 592 H84"/>
  <text class="dimlbl" x="70" y="340" text-anchor="end" transform="rotate(-90 70 340)">about 3.5 ft with the pot</text>

</svg>
